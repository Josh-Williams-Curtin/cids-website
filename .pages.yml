media: public/images
content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{title}.md"
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: pubDate
        label: Publish Date
        type: date
      - name: body
        label: Content
        type: rich-text
    view:
      primary: title
      sort: pubDate
      order: desc

actions:
  - name: merge-to-main
    label: Merge to main & deploy
    workflow: merge-cms.yml
    ref: main
    cancelable: false
    confirm:
      title: Merge to main?
      message: This merges the cms branch into main and deploys the site to GitHub Pages.
      button: Merge & deploy
